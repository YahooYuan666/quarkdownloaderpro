[workspace]
resolver = "2"
members = ["src-tauri", "crates/download-engine", "crates/quark-core"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["stream", "native-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "net", "process"] }
tokio-util = "0.7"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
